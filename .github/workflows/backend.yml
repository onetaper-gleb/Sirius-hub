name: PR Backend CI

on:
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**', '.bazelversion', 'MODULE.bazel*', '.github/workflows/backend.yml' ]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Check Python formatting
        run: |
          black --check backend
          isort --check-only backend

  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'

      - uses: bazel-contrib/setup-bazel@0.19.1

      - name: Run backend tests
        working-directory: .
        run: >
          bazel test //backend:backend_tests
          --test_env=BACKEND_TEST_PYTHON="$(command -v python)"
          --test_env=DART="$(command -v dart)"
          --test_output=errors
