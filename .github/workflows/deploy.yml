name: Deploy FastAPI

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FIREBASE_CONFIG_BASE64,DB_USER,DB_PASSWORD,DB_NAME
          script: |
            set -e

            mkdir -p ~/app/Sirius-hub
            cd ~/app/Sirius-hub

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd backend

            umask 077
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            keys = ("FIREBASE_CONFIG_BASE64", "DB_USER", "DB_PASSWORD", "DB_NAME")
            text = "".join(
                f"{key}={json.dumps(os.environ[key].replace('$', '$$'), ensure_ascii=False)}\n"
                for key in keys
            )
            config = Path(".env")
            config.write_text(text)
            config.chmod(0o600)
            PY

            docker compose build
            mkdir -p uploads
            if docker container inspect camphub-fastapi >/dev/null 2>&1; then
              upload_mount=$(docker container inspect --format '{{range .Mounts}}{{if eq .Destination "/app/uploads"}}{{.Source}}{{end}}{{end}}' camphub-fastapi)
              if [ "$upload_mount" != "$(pwd)/uploads" ]; then
                docker stop camphub-fastapi
                trap 'docker start camphub-fastapi >/dev/null 2>&1 || true' EXIT
                docker cp camphub-fastapi:/app/uploads/. uploads/
              fi
            fi
            docker compose up -d
            trap - EXIT
