name: Deploy FastAPI

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/deploy.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - name: Check deployment configuration
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${#JWT_SECRET_KEY}" -ge 32
          test -n "$DB_USER" && test -n "$DB_PASSWORD" && test -n "$DB_NAME"

      - name: Deploy to Server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: SHA256:Y+5SuiwFzUUPdx1zEILX2ZJsRjo8p8KrCwaM2EIk6to
          command_timeout: 30m
          envs: JWT_SECRET_KEY,DB_USER,DB_PASSWORD,DB_NAME,DEPLOY_SHA
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            umask 077
            test "${#JWT_SECRET_KEY}" -ge 32
            test -n "$DB_USER" && test -n "$DB_PASSWORD" && test -n "$DB_NAME"
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            exec 9>/tmp/sirius-hub-deploy.lock
            flock -n 9 || { echo 'Another deployment holds the server lock'; exit 1; }
            if pgrep -f '[d]ocker (compose|buildx|build)' >/dev/null; then
              echo 'An earlier Docker operation is still running'
              exit 1
            fi
            active_dir=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' camphub-fastapi)
            test -d "$active_dir/../.git"
            cd "$active_dir/.."
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            exec bash backend/deploy.sh
            DEPLOY
