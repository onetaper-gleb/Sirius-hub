name: Deploy FastAPI

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/deploy.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - name: Check deployment configuration
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${#JWT_SECRET_KEY}" -ge 32
          test -n "$DB_USER" && test -n "$DB_PASSWORD" && test -n "$DB_NAME"

      - name: Deploy to Server
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/sirius-deploy.XXXXXX")
          trap 'rm -rf "$private"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" >"$private/key"
          printf '%s\n' '104.143.201.57 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFxKq+usJBbk6neVphUqDuF0jjdoeLKufS5ypT1Ya4Lc' >"$private/known_hosts"
          chmod 600 "$private/key" "$private/known_hosts"
          for name in JWT_SECRET_KEY DB_USER DB_PASSWORD DB_NAME DEPLOY_SHA; do
            printf 'export %s=%q\n' "$name" "${!name}"
          done >"$private/payload"
          cat >>"$private/payload" <<'REMOTE'
          bash -se <<'DEPLOY'
          set -euo pipefail
          umask 077
          test "${#JWT_SECRET_KEY}" -ge 32
          test -n "$DB_USER" && test -n "$DB_PASSWORD" && test -n "$DB_NAME"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          exec 9>/tmp/sirius-hub-deploy.lock
          flock -n 9 || { echo 'Another deployment holds the server lock'; exit 1; }
          if pgrep -f '[d]ocker (compose|buildx|build)' >/dev/null; then
            echo 'An earlier Docker operation is still running'
            exit 1
          fi
          active_dir=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' camphub-fastapi)
          test -d "$active_dir/../.git"
          cd "$active_dir/.."
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          exec bash backend/deploy.sh
          DEPLOY
          REMOTE
          timeout --signal=TERM 30m ssh -i "$private/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$private/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$SERVER_USER@104.143.201.57" 'bash -se' <"$private/payload"
