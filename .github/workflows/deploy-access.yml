name: Deployment access bootstrap
on:
  push:
    branches: [ 'ops/deploy-access-20261109' ]
permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install the temporary public key
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          identity="$RUNNER_TEMP/deploy-key"
          known="$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f "$identity" "$known"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" >"$identity"
          printf '%s\n' '104.143.201.57 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFxKq+usJBbk6neVphUqDuF0jjdoeLKufS5ypT1Ya4Lc' >"$known"          chmod 600 "$identity" "$known"
          ssh -i "$identity" -o IdentitiesOnly=yes -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$SERVER_USER@104.143.201.57" 'bash -se' <<'REMOTE'
          set -eu
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          grep -qxF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrRSvRLS64H1QtRd6NXWgszusaYpxeCKjR+kPDMC17H codex-sirius-deploy-20261109' ~/.ssh/authorized_keys || printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrRSvRLS64H1QtRd6NXWgszusaYpxeCKjR+kPDMC17H codex-sirius-deploy-20261109' >> ~/.ssh/authorized_keys
          printf 'ssh_access_user=%s\n' "$(id -un)"
          REMOTE
