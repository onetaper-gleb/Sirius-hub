name: Deployment access bootstrap
on:
  push:
    branches: [ 'ops/deploy-access-20261109' ]
permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: SHA256:Y+5SuiwFzUUPdx1zEILX2ZJsRjo8p8KrCwaM2EIk6to
          command_timeout: 2m
          script: |
            set -eu
            umask 077
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            grep -qxF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrRSvRLS64H1QtRd6NXWgszusaYpxeCKjR+kPDMC17H codex-sirius-deploy-20261109' ~/.ssh/authorized_keys || printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrRSvRLS64H1QtRd6NXWgszusaYpxeCKjR+kPDMC17H codex-sirius-deploy-20261109' >> ~/.ssh/authorized_keys
            printf 'ssh_access_user=%s\n' "$(id -un)"
